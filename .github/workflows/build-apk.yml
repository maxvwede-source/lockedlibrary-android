name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Gradle
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias lockedlibrary \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lockedlibrary -keypass lockedlibrary \
            -dname "CN=LockedLibrary, OU=App, O=LockedLibrary, L=Lagos, ST=Lagos, C=NG"

      - name: Build APKs
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASS: lockedlibrary
          KEY_ALIAS: lockedlibrary
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lockedlibrary-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14
